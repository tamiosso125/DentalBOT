# Desenvolvimento local e base da VPS (Hostinger KVM 2).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dentalbot
      POSTGRES_PASSWORD: dentalbot
      POSTGRES_DB: dentalbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalbot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  api:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dentalbot:dentalbot@postgres:5432/dentalbot
      REDIS_URL: redis://redis:6379
      QUEUE_MODE: redis
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
