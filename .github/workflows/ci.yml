name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentalbot
          POSTGRES_PASSWORD: dentalbot
          POSTGRES_DB: dentalbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dentalbot" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dentalbot:dentalbot@localhost:5432/dentalbot_test
      TEST_DATABASE_URL: postgresql://dentalbot:dentalbot@localhost:5432/dentalbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm prisma migrate deploy
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm build
