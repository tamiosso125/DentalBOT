name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentalbot
          POSTGRES_PASSWORD: dentalbot
          POSTGRES_DB: dentalbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dentalbot" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dentalbot:dentalbot@localhost:5432/dentalbot_test
      TEST_DATABASE_URL: postgresql://dentalbot:dentalbot@localhost:5432/dentalbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm db:generate
      - run: pnpm prisma migrate deploy
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm build
      - run: pnpm --filter @dentalbot/panel typecheck
      - run: pnpm --filter @dentalbot/panel test
      - run: pnpm --filter @dentalbot/panel build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # The production images and stack (deploy/compose.yml) build and parse.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dentalbot-api .
      - run: docker build -f panel/Dockerfile -t dentalbot-panel .
      - run: docker build -t dentalbot-backup deploy/backup
      - name: Compose file is valid
        run: |
          printf '%s\n' DOMAIN=example.com POSTGRES_PASSWORD=x ADMIN_API_TOKEN=x \
            PANEL_PASSWORD=x PANEL_SESSION_SECRET=x BACKUP_AGE_RECIPIENT=age1x > deploy/.env
          docker compose -f deploy/compose.yml config --quiet
      - name: Backup script is valid shell
        run: docker run --rm -v "$PWD/deploy/backup:/b:ro" alpine:3 sh -n /b/backup.sh
