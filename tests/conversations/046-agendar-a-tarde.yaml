name: Paciente pede horário à tarde e só recebe opções da tarde
ai: true
steps:
  - patient: "quero marcar uma avaliação, mas só posso à tarde"
    model:
      route: agenda
      replies:
        - tool: listar_horarios
          input: { procedimento: "avaliação", periodo: "tarde" }
        - text: "Separei horários à tarde para a avaliação. Escolha um na lista abaixo."
    expect:
      list: true
      contains: ["seg 19/10 13:00"]
      not_contains: ["08:00", "09:00", "10:00", "11:00"]
      appointments: 0
