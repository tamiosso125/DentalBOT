name: Confirmar no lembrete funciona com a recepção atendendo
steps:
  - clinic_books: { procedureId: proc_limpeza, at: "2026-10-20T09:00" }
  - run_reminders: true
  - patient: "oi, posso levar meu filho junto?"
  - reception: "Pode sim, Maria!"
  - button: "appt:{appointment}:confirm"
    title: "Confirmar"
    expect:
      contains: ["está confirmada"]
      # The front desk has the chat: the bot asks nothing new.
      not_contains: ["retorno"]
      appointment_status: CONFIRMED
